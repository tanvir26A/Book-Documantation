<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লাইব্রেরি ম্যানেজমেন্ট</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #F5EFE6;
            --fg: #1A1A1A;
            --muted: #8B7E6A;
            --accent: #C8602A;
            --accent-light: #E8845A;
            --card: #FFFFFF;
            --border: #DDD3C3;
            --primary: #1B4332;
            --primary-light: #2D6A4F;
            --sidebar-bg: #142A1F;
            --success: #40916C;
            --warning: #E9C46A;
            --danger: #E76F51;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans Bengali', sans-serif; background: var(--bg); color: var(--fg); overflow-x: hidden; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

        .sidebar {
            position: fixed; left: 0; top: 0; bottom: 0; width: 260px;
            background: var(--sidebar-bg); z-index: 50; transition: transform 0.35s cubic-bezier(.4,0,.2,1);
            overflow-y: auto;
        }
        .sidebar.closed { transform: translateX(-100%); }
        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 20px;
            color: #A3B8A8; cursor: pointer; transition: all 0.2s; border-radius: 8px; margin: 2px 12px;
            font-size: 15px;
        }
        .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .nav-item.active { background: var(--accent); color: #fff; font-weight: 600; }
        .nav-item i { width: 20px; text-align: center; font-size: 16px; }

        .main-content { margin-left: 260px; min-height: 100vh; transition: margin-left 0.35s; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
        }

        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 14px;
            padding: 20px; transition: box-shadow 0.25s, transform 0.25s;
        }
        .card:hover { box-shadow: 0 8px 30px rgba(27,67,50,0.1); }

        .stat-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 14px;
            padding: 20px; position: relative; overflow: hidden;
        }
        .stat-card::after {
            content: ''; position: absolute; top: -20px; right: -20px;
            width: 80px; height: 80px; border-radius: 50%; opacity: 0.1;
        }
        .stat-card.green::after { background: var(--primary); }
        .stat-card.orange::after { background: var(--accent); }
        .stat-card.yellow::after { background: var(--warning); }
        .stat-card.red::after { background: var(--danger); }

        .btn-primary {
            background: var(--primary); color: #fff; padding: 10px 22px; border-radius: 10px;
            border: none; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-1px); }
        .btn-accent {
            background: var(--accent); color: #fff; padding: 10px 22px; border-radius: 10px;
            border: none; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-accent:hover { background: var(--accent-light); transform: translateY(-1px); }
        .btn-outline {
            background: transparent; color: var(--primary); padding: 8px 18px; border-radius: 10px;
            border: 1.5px solid var(--border); cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-outline:hover { border-color: var(--primary); background: rgba(27,67,50,0.05); }
        .btn-danger {
            background: var(--danger); color: #fff; padding: 6px 14px; border-radius: 8px;
            border: none; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 500;
            transition: all 0.2s;
        }
        .btn-danger:hover { background: #D35A3F; }
        .btn-sm {
            padding: 6px 14px; font-size: 12px; border-radius: 8px;
            border: none; cursor: pointer; font-family: inherit; font-weight: 500; transition: all 0.2s;
        }

        .form-input {
            width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px;
            font-family: inherit; font-size: 14px; background: #FAFAF7; color: var(--fg);
            transition: border-color 0.2s, box-shadow 0.2s; outline: none;
        }
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(27,67,50,0.1); }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }

        .modal-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100;
            display: flex; align-items: center; justify-content: center; padding: 16px;
            opacity: 0; pointer-events: none; transition: opacity 0.25s;
        }
        .modal-backdrop.active { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: var(--card); border-radius: 18px; width: 100%; max-width: 500px;
            max-height: 90vh; overflow-y: auto; transform: scale(0.92) translateY(20px);
            transition: transform 0.3s cubic-bezier(.4,0,.2,1); padding: 28px;
        }
        .modal-backdrop.active .modal-box { transform: scale(1) translateY(0); }

        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            padding: 12px 20px; border-radius: 10px; color: #fff; font-size: 14px; font-weight: 500;
            transform: translateX(120%); transition: transform 0.35s cubic-bezier(.4,0,.2,1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px;
            min-width: 250px;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--primary); }

        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th {
            text-align: left; padding: 12px 14px; font-size: 12px; font-weight: 700;
            color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border); background: #FAFAF7;
        }
        .data-table td {
            padding: 12px 14px; font-size: 14px; border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        .data-table tr:hover td { background: rgba(27,67,50,0.03); }

        .badge {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 11px; font-weight: 700;
        }
        .badge-green { background: #D8F3DC; color: #1B4332; }
        .badge-red { background: #FDDDDD; color: #9B1C1C; }
        .badge-orange { background: #FFE8D6; color: #9C4221; }
        .badge-blue { background: #D6EAF8; color: #1A5276; }

        .reader-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 14px;
            padding: 20px; cursor: pointer; transition: all 0.25s;
        }
        .reader-card:hover { box-shadow: 0 8px 30px rgba(27,67,50,0.12); transform: translateY(-3px); border-color: var(--primary); }
        .reader-avatar {
            width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 800; color: #fff;
        }

        .profile-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 50%, #40916C 100%);
            border-radius: 18px; padding: 28px; color: #fff; position: relative; overflow: hidden;
        }
        .profile-header::before {
            content: ''; position: absolute; top: -40px; right: -40px;
            width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,0.08);
        }
        .profile-header::after {
            content: ''; position: absolute; bottom: -60px; left: 30%;
            width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.05);
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeInUp 0.4s ease-out forwards; }
        .delay-1 { animation-delay: 0.05s; opacity: 0; }
        .delay-2 { animation-delay: 0.1s; opacity: 0; }
        .delay-3 { animation-delay: 0.15s; opacity: 0; }
        .delay-4 { animation-delay: 0.2s; opacity: 0; }

        .search-bar {
            position: relative;
        }
        .search-bar i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px;
        }
        .search-bar input { padding-left: 40px; }

        .tab-btn {
            padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 600;
            cursor: pointer; border: none; font-family: inherit; transition: all 0.2s;
            background: transparent; color: var(--muted);
        }
        .tab-btn.active { background: var(--primary); color: #fff; }
        .tab-btn:hover:not(.active) { background: rgba(27,67,50,0.08); color: var(--fg); }

        @media (max-width: 768px) {
            .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .data-table th, .data-table td { padding: 10px 12px; white-space: nowrap; }
        }

        .print-only { display: none; }
        @media print {
            .sidebar, .topbar, .no-print { display: none !important; }
            .main-content { margin-left: 0 !important; }
            .print-only { display: block; }
        }

        .float-shape {
            position: absolute; border-radius: 50%; opacity: 0.04; pointer-events: none;
            animation: floatShape 8s ease-in-out infinite;
        }
        @keyframes floatShape {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* লোডিং ওভারলে (Firebase থেকে ডেটা আসার সময়) */
        #loadingOverlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 999;
            display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
        }
        .loader-spin {
            width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--primary);
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

// Firebase-এ ডেটা সেভ করা (localStorage-এর বদলে)
function saveData(key, data) {
    db.ref(key).set(data).catch(err => {
        console.error(err);
        showToast('ডেটা সংরক্ষণ ব্যর্থ হয়েছে: ' + err.message, 'error');
    });
}

let books = [];
let readers = [];
let transactions = [];
let currentPage = 'dashboard';
let currentReaderId = null;
let readerTab = 'profile';

function nextId(arr) { return arr.length > 0 ? Math.max(...arr.map(i => i.id)) + 1 : 1; }
function nextBookNumber() {
    const max = books.reduce((m, b) => { const n = parseInt(b.bookNumber.replace('BN-','')); return n > m ? n : m; }, 0);
    return 'BN-' + String(max + 1).padStart(3, '0');
}

// ==================== টোস্ট ====================
function showToast(msg, type = 'success') {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'times-circle' : 'info-circle';
    t.innerHTML = `<i class="fas fa-${icon}"></i> ${msg}`;
    c.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 3000);
}

// ==================== মোডাল ====================
function openModal(html) {
    document.getElementById('modalBox').innerHTML = html;
    document.getElementById('modalBackdrop').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('active');
    document.body.style.overflow = '';
}

// ==================== সাইডবার ====================
function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('sidebarOverlay');
    sb.classList.toggle('open');
    ov.classList.toggle('active');
}

function checkMobile() {
    const btn = document.getElementById('menuBtn');
    btn.style.display = window.innerWidth <= 768 ? 'block' : 'none';
}
window.addEventListener('resize', checkMobile);
checkMobile();

// ==================== নেভিগেশন ====================
function navigateTo(page, readerId) {
    currentPage = page;
    currentReaderId = readerId || null;
    readerTab = 'profile';

    document.querySelectorAll('.nav-item').forEach(n => {
        n.classList.toggle('active', n.dataset.page === page);
    });

    const titles = { dashboard: 'ড্যাশবোর্ড', books: 'বই সমূহ', readers: 'রিডার সমূহ', issueReturn: 'ইস্যু / রিটার্ন', history: 'ইতিহাস', readerDetail: 'রিডার প্রোফাইল' };
    document.getElementById('pageTitle').textContent = titles[page] || 'ড্যাশবোর্ড';

    if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('active');
    }

    renderPage();
}

function renderPage() {
    const c = document.getElementById('pageContent');
    switch(currentPage) {
        case 'dashboard': c.innerHTML = renderDashboard(); break;
        case 'books': c.innerHTML = renderBooks(); break;
        case 'readers': c.innerHTML = renderReaders(); break;
        case 'issueReturn': c.innerHTML = renderIssueReturn(); break;
        case 'history': c.innerHTML = renderHistory(); break;
        case 'readerDetail': c.innerHTML = renderReaderDetail(); break;
    }
}

// ==================== ড্যাশবোর্ড ====================

            </div>
            <div class="stat-card orange animate-in delay-2">
                <div style="display:flex;align-items:center;justify-content:space-between;">
                    <div>
                        <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;">ইস্যুকৃত বই</div>
                        <div style="font-size:32px;font-weight:900;color:var(--accent);line-height:1;">${issuedBooks}</div>
                    </div>

                <div style="display:flex;align-items:center;justify-content:space-between;">
                    <div>
                        <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;">মোট রিডার</div>
                        <div style="font-size:32px;font-weight:900;color:#B8860B;line-height:1;">${totalReaders}</div>
                    </div>
                    <div style="width:48px;height:48px;background:rgba(184,134,11,0.1);border-radius:14px;display:flex;align-items:center;justify-content:center;">
                        <i class="fas fa-users" style="color:#B8860B;font-size:20px;"></i>

            </div>

                <div style="display:flex;align-items:center;justify-content:space-between;">

                        <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;">বর্তমানে ইস্যু</div>

                    </div>

// ==================== বই পেজ ====================
function renderBooks() {
    return `
    <div class="animate-in">
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;">
            <div class="search-bar" style="flex:1;min-width:200px;max-width:360px;">
                <i class="fas fa-search"></i>
                <input class="form-input" id="bookSearch" placeholder="বই খুঁজুন..." oninput="filterBooks()" style="padding-left:40px;">
            </div>
            <button class="btn-primary" onclick="openBookModal()">
                <i class="fas fa-plus"></i> নতুন বই যোগ করুন
            </button>
        </div>
        <div class="card table-wrap" style="padding:0;overflow:hidden;">
            <table class="data-table" id="booksTable">
                <thead>
                    <tr>
                        <th>নং</th>
                        <th>বই নম্বর</th>
                        <th>বইয়ের নাম</th>
                        <th>লেখক</th>
                        <th>ক্যাটাগরি</th>
                        <th>মোট</th>
                        <th>পাওয়া যাচ্ছে</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="booksBody"></tbody>
            </table>
        </div>
    </div>`;
}

function filterBooks() {
    const q = document.getElementById('bookSearch').value.toLowerCase();
    const filtered = books.filter(b =>
        b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q) || b.category.toLowerCase().includes(q) || b.bookNumber.toLowerCase().includes(q)
    );
    renderBooksTable(filtered);
}

function renderBooksTable(list) {
    const tbody = document.getElementById('booksBody');
    if (!tbody) return;
    if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--muted);">কোনো বই পাওয়া যায়নি</td></tr>`;
        return;
    }
    tbody.innerHTML = list.map((b, i) => `
        <tr>
            <td style="font-weight:600;color:var(--muted);">${i + 1}</td>
            <td><span style="background:rgba(27,67,50,0.08);padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;color:var(--primary);">${b.bookNumber}</span></td>
            <td style="font-weight:600;">${b.title}</td>
            <td style="color:var(--muted);font-size:13px;">${b.author}</td>
            <td><span class="badge badge-blue">${b.category}</span></td>
            <td style="font-weight:700;text-align:center;">${b.total}</td>
            <td style="text-align:center;">
                <span style="font-weight:700;color:${b.available > 0 ? 'var(--success)' : 'var(--danger)'};">${b.available}</span>
            </td>
            <td>
                <div style="display:flex;gap:6px;">
                    <button class="btn-sm" style="background:rgba(27,67,50,0.1);color:var(--primary);" onclick="openBookModal(${b.id})" title="সম্পাদনা">
                        <i class="fas fa-pen" style="font-size:11px;"></i>
                    </button>
                    <button class="btn-sm" style="background:rgba(231,111,81,0.1);color:var(--danger);" onclick="deleteBook(${b.id})" title="মুছুন">
                        <i class="fas fa-trash" style="font-size:11px;"></i>
                    </button>
                </div>
            </td>
        </tr>
    `).join('');
}

function openBookModal(id) {
    const book = id ? books.find(b => b.id === id) : null;
    const isEdit = !!book;
    openModal(`
        <h3 style="font-size:18px;font-weight:800;color:var(--primary);margin-bottom:20px;">${isEdit ? 'বই সম্পাদনা করুন' : 'নতুন বই যোগ করুন'}</h3>
        <form onsubmit="saveBook(event, ${id || 0})">
            <div style="display:grid;gap:14px;">
                <div>
                    <label class="form-label">বইয়ের নাম</label>
                    <input class="form-input" id="mBookTitle" value="${isEdit ? book.title : ''}" required>
                </div>
                <div>
                    <label class="form-label">লেখক</label>
                    <input class="form-input" id="mBookAuthor" value="${isEdit ? book.author : ''}" required>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                    <div>
                        <label class="form-label">ক্যাটাগরি</label>
                        <input class="form-input" id="mBookCategory" value="${isEdit ? book.category : ''}" placeholder="যেমন: উপন্যাস" required>
                    </div>
                    <div>
                        <label class="form-label">বই নম্বর</label>
                        <input class="form-input" id="mBookNumber" value="${isEdit ? book.bookNumber : nextBookNumber()}" required>
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                    <div>
                        <label class="form-label">মোট সংখ্যা</label>
                        <input class="form-input" id="mBookTotal" type="number" min="1" value="${isEdit ? book.total : 1}" required>
                    </div>
                    <div>
                        <label class="form-label">বর্তমানে পাওয়া যাচ্ছে</label>
                        <input class="form-input" id="mBookAvail" type="number" min="0" max="${isEdit ? book.total : 1}" value="${isEdit ? book.available : 1}" required>
                    </div>
                </div>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:22px;">
                <button type="button" class="btn-outline" onclick="closeModal()">বাতিল</button>
                <button type="submit" class="btn-primary">${isEdit ? 'আপডেট করুন' : 'সংরক্ষণ করুন'}</button>
            </div>
        </form>
    `);
}

function saveBook(e, id) {
    e.preventDefault();
    const title = document.getElementById('mBookTitle').value.trim();
    const author = document.getElementById('mBookAuthor').value.trim();
    const category = document.getElementById('mBookCategory').value.trim();
    const bookNumber = document.getElementById('mBookNumber').value.trim();
    const total = parseInt(document.getElementById('mBookTotal').value);
    const available = parseInt(document.getElementById('mBookAvail').value);

    if (available > total) { showToast('পাওয়া যাচ্ছে মোটের চেয়ে বেশি হতে পারে না', 'error'); return; }

    if (id) {
        const book = books.find(b => b.id === id);
        Object.assign(book, { title, author, category, bookNumber, total, available });
        showToast('বই আপডেট হয়েছে');
    } else {
        books.push({ id: nextId(books), title, author, category, bookNumber, total, available });
        showToast('নতুন বই যোগ হয়েছে');
    }
    saveData('lib_books', books);
    closeModal();
    renderPage();
    setTimeout(() => { filterBooks(); }, 50);
}

function deleteBook(id) {
    const book = books.find(b => b.id === id);
    openModal(`
        <div style="text-align:center;padding:10px 0;">
            <div style="width:56px;height:56px;background:rgba(231,111,81,0.12);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
                <i class="fas fa-trash" style="color:var(--danger);font-size:22px;"></i>
            </div>
            <h3 style="font-size:17px;font-weight:800;color:var(--fg);margin-bottom:8px;">বই মুছে ফেলুন?</h3>
            <p style="font-size:13px;color:var(--muted);margin-bottom:24px;">"${book.title}" — এই বইটি মুছে ফেলা হবে।</p>
            <div style="display:flex;gap:10px;justify-content:center;">
                <button class="btn-outline" onclick="closeModal()">না</button>
                <button class="btn-danger" style="padding:10px 24px;font-size:14px;" onclick="confirmDeleteBook(${id})">হ্যাঁ, মুছুন</button>
            </div>
        </div>
    `);
}
function confirmDeleteBook(id) {
    books = books.filter(b => b.id !== id);
    saveData('lib_books', books);
    closeModal();
    showToast('বই মুছে ফেলা হয়েছে');
    renderPage();
    setTimeout(() => filterBooks(), 50);
}

// ==================== রিডার পেজ ====================
function renderReaders() {
    return `
    <div class="animate-in">
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;">
            <div class="search-bar" style="flex:1;min-width:200px;max-width:360px;">
                <i class="fas fa-search"></i>
                <input class="form-input" id="readerSearch" placeholder="রিডার খুঁজুন..." oninput="filterReaders()" style="padding-left:40px;">
            </div>
            <button class="btn-primary" onclick="openReaderModal()">
                <i class="fas fa-user-plus"></i> নতুন রিডার যোগ করুন
            </button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;" id="readerGrid"></div>
    </div>`;
}

function filterReaders() {
    const q = document.getElementById('readerSearch').value.toLowerCase();
    const filtered = readers.filter(r =>
        r.name.toLowerCase().includes(q) || r.className.toLowerCase().includes(q) || r.roll.includes(q)
    );
    renderReaderGrid(filtered);
}

function renderReaderGrid(list) {
    const grid = document.getElementById('readerGrid');
    if (!grid) return;
    if (list.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);">কোনো রিডার পাওয়া যায়নি</div>`;
        return;
    }
    grid.innerHTML = list.map(r => {
        const issued = transactions.filter(t => t.readerId === r.id && t.status === 'issued').length;
        const totalRead = transactions.filter(t => t.readerId === r.id && t.status === 'returned').length;
        const initials = r.name.split(' ').map(w => w[0]).join('').substring(0, 2);
        return `
        <div class="reader-card" onclick="navigateTo('readerDetail', ${r.id})">
            <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">
                <div class="reader-avatar" style="background:${r.color};">${initials}</div>
                <div style="flex:1;min-width:0;">
                    <div style="font-size:15px;font-weight:800;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${r.name}</div>
                    <div style="font-size:12px;color:var(--muted);">${r.className} — রোল: ${r.roll}</div>
                </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <div style="background:rgba(200,96,42,0.08);padding:10px;border-radius:10px;text-align:center;">
                    <div style="font-size:20px;font-weight:900;color:var(--accent);">${issued}</div>
                    <div style="font-size:10px;font-weight:600;color:var(--muted);">বর্তমানে নিয়েছে</div>
                </div>
                <div style="background:rgba(64,145,108,0.08);padding:10px;border-radius:10px;text-align:center;">
                    <div style="font-size:20px;font-weight:900;color:var(--success);">${totalRead}</div>
                    <div style="font-size:10px;font-weight:600;color:var(--muted);">মোট পড়েছে</div>
                </div>
            </div>
        </div>`;
    }).join('');
}

function openReaderModal(id) {
    const reader = id ? readers.find(r => r.id === id) : null;
    const isEdit = !!reader;
    const colors = ['#1B4332','#C8602A','#7B2D8E','#2D6A4F','#9C4221','#B8860B','#1A5276','#8B4513'];
    openModal(`
        <h3 style="font-size:18px;font-weight:800;color:var(--primary);margin-bottom:20px;">${isEdit ? 'রিডার সম্পাদনা' : 'নতুন রিডার যোগ করুন'}</h3>
        <form onsubmit="saveReader(event, ${id || 0})">
            <div style="display:grid;gap:14px;">
                <div>
                    <label class="form-label">নাম</label>
                    <input class="form-input" id="mReaderName" value="${isEdit ? reader.name : ''}" required>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                    <div>
                        <label class="form-label">ক্লাস</label>
                        <input class="form-input" id="mReaderClass" value="${isEdit ? reader.className : ''}" placeholder="যেমন: দশম শ্রেণি" required>
                    </div>
                    <div>
                        <label class="form-label">রোল নম্বর</label>
                        <input class="form-input" id="mReaderRoll" value="${isEdit ? reader.roll : ''}" required>
                    </div>
                </div>
                <div>
                    <label class="form-label">ফোন নম্বর</label>
                    <input class="form-input" id="mReaderPhone" value="${isEdit ? reader.phone : ''}" required>
                </div>
                <div>
                    <label class="form-label">ঠিকানা</label>
                    <input class="form-input" id="mReaderAddress" value="${isEdit ? reader.address : ''}" required>
                </div>
                ${!isEdit ? `
                <div>
                    <label class="form-label">রঙ নির্বাচন করুন</label>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        ${colors.map((c, i) => `
                            <div onclick="document.querySelectorAll('.color-pick').forEach(e=>e.style.outline='none');this.style.outline='3px solid var(--fg)';this.style.outlineOffset='2px';document.getElementById('mReaderColor').value='${c}';"
                                class="color-pick" style="width:32px;height:32px;border-radius:50%;background:${c};cursor:pointer;${i===0?'outline:3px solid var(--fg);outline-offset:2px;':''}"></div>
                        `).join('')}
                    </div>
                    <input type="hidden" id="mReaderColor" value="${colors[0]}">
                </div>` : `<input type="hidden" id="mReaderColor" value="${reader.color}">`}
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:22px;">
                <button type="button" class="btn-outline" onclick="closeModal()">বাতিল</button>
                <button type="submit" class="btn-primary">${isEdit ? 'আপডেট করুন' : 'সংরক্ষণ করুন'}</button>
            </div>
        </form>
    `);
}

function saveReader(e, id) {
    e.preventDefault();
    const name = document.getElementById('mReaderName').value.trim();
    const className = document.getElementById('mReaderClass').value.trim();
    const roll = document.getElementById('mReaderRoll').value.trim();
    const phone = document.getElementById('mReaderPhone').value.trim();
    const address = document.getElementById('mReaderAddress').value.trim();
    const color = document.getElementById('mReaderColor').value;

    if (id) {
        const reader = readers.find(r => r.id === id);
        Object.assign(reader, { name, className, roll, phone, address });
        showToast('রিডার তথ্য আপডেট হয়েছে');
    } else {
        const now = new Date();
        const bnDate = toBanglaDate(now);
        readers.push({ id: nextId(readers), name, className, roll, phone, address, joinDate: bnDate, color });
        showToast('নতুন রিডার যোগ হয়েছে');
    }
    saveData('lib_readers', readers);
    closeModal();
    renderPage();
    setTimeout(() => filterReaders(), 50);
}

function deleteReader(id) {
    const reader = readers.find(r => r.id === id);
    const issued = transactions.filter(t => t.readerId === id && t.status === 'issued').length;
    if (issued > 0) { showToast('এই রিডারের ইস্যুকৃত বই আছে, আগে ফেরত দিন', 'error'); return; }
    openModal(`
        <div style="text-align:center;padding:10px 0;">
            <div style="width:56px;height:56px;background:rgba(231,111,81,0.12);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
                <i class="fas fa-user-minus" style="color:var(--danger);font-size:22px;"></i>
            </div>
            <h3 style="font-size:17px;font-weight:800;color:var(--fg);margin-bottom:8px;">রিডার মুছে ফেলুন?</h3>
            <p style="font-size:13px;color:var(--muted);margin-bottom:24px;">"${reader.name}" — এই রিডারকে মুছে ফেলা হবে।</p>
            <div style="display:flex;gap:10px;justify-content:center;">
                <button class="btn-outline" onclick="closeModal()">না</button>
                <button class="btn-danger" style="padding:10px 24px;font-size:14px;" onclick="confirmDeleteReader(${id})">হ্যাঁ, মুছুন</button>
            </div>
        </div>
    `);
}
function confirmDeleteReader(id) {
    readers = readers.filter(r => r.id !== id);
    transactions = transactions.filter(t => t.readerId !== id);
    saveData('lib_readers', readers);
    saveData('lib_transactions', transactions);
    closeModal();
    showToast('রিডার মুছে ফেলা হয়েছে');
    navigateTo('readers');
}

// ==================== রিডার ডিটেইল/প্রোফাইল ====================
function renderReaderDetail() {
    const reader = readers.find(r => r.id === currentReaderId);
    if (!reader) return `<div style="text-align:center;padding:60px;color:var(--muted);">রিডার পাওয়া যায়নি</div>`;

    const issuedTx = transactions.filter(t => t.readerId === reader.id && t.status === 'issued');
    const returnedTx = transactions.filter(t => t.readerId === reader.id && t.status === 'returned');
    const initials = reader.name.split(' ').map(w => w[0]).join('').substring(0, 2);
    const allTx = transactions.filter(t => t.readerId === reader.id);

    let tabContent = '';
    if (readerTab === 'profile') {
        tabContent = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px;">
            <div class="card" style="text-align:center;">
                <div style="font-size:28px;font-weight:900;color:var(--accent);">${issuedTx.length}</div>
                <div style="font-size:12px;color:var(--muted);font-weight:600;">বর্তমানে নিয়েছে</div>
            </div>
            <div class="card" style="text-align:center;">
                <div style="font-size:28px;font-weight:900;color:var(--success);">${returnedTx.length}</div>
                <div style="font-size:12px;color:var(--muted);font-weight:600;">মোট পড়েছে</div>
            </div>
            <div class="card" style="text-align:center;">
                <div style="font-size:28px;font-weight:900;color:var(--primary);">${allTx.length}</div>
                <div style="font-size:12px;color:var(--muted);font-weight:600;">মোট ট্রানজেকশন</div>
            </div>
        </div>
        <div class="card">
            <h4 style="font-size:14px;font-weight:800;color:var(--primary);margin-bottom:14px;">ব্যক্তিগত তথ্য</h4>
            <div style="display:grid;gap:12px;">
                ${[
                    ['fa-graduation-cap', 'ক্লাস', reader.className],
                    ['fa-id-card', 'রোল নম্বর', reader.roll],
                    ['fa-phone', 'ফোন', reader.phone],
                    ['fa-location-dot', 'ঠিকানা', reader.address],
                    ['fa-calendar', 'যোগদানের তারিখ', reader.joinDate],
                ].map(([icon, label, val]) => `
                    <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:#FAFAF7;border-radius:10px;">
                        <div style="width:36px;height:36px;background:rgba(27,67,50,0.08);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                            <i class="fas ${icon}" style="color:var(--primary);font-size:14px;"></i>
                        </div>
                        <div>
                            <div style="font-size:11px;color:var(--muted);font-weight:600;">${label}</div>
                            <div style="font-size:14px;font-weight:600;">${val}</div>
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>`;
    } else if (readerTab === 'issued') {
        if (issuedTx.length === 0) {
            tabContent = `<div class="card" style="text-align:center;padding:50px;color:var(--muted);"><i class="fas fa-book-open" style="font-size:36px;margin-bottom:12px;opacity:0.3;display:block;"></i>কোনো বই নেওয়া হয়নি</div>`;
        } else {
            tabContent = `
            <div style="display:flex;flex-direction:column;gap:12px;">
                ${issuedTx.map(t => {
                    const book = books.find(b => b.id === t.bookId);
                    return `
                    <div class="card" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
                        <div style="width:44px;height:44px;background:rgba(200,96,42,0.1);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                            <i class="fas fa-book" style="color:var(--accent);font-size:16px;"></i>
                        </div>
                        <div style="flex:1;min-width:150px;">
                            <div style="font-size:14px;font-weight:700;">${book ? book.title : 'অজানা'}</div>
                            <div style="font-size:12px;color:var(--muted);">${book ? book.author : ''} — ${book ? book.bookNumber : ''}</div>
                        </div>
                        <div style="text-align:right;min-width:120px;">
                            <div style="font-size:11px;color:var(--muted);">ইস্যু: ${t.issueDate}</div>
                            <div style="font-size:11px;color:var(--danger);font-weight:600;">ডিউ: ${t.dueDate}</div>
                        </div>
                        <button class="btn-accent" style="font-size:12px;padding:8px 16px;" onclick="returnBook(${t.id})">
                            <i class="fas fa-rotate-left"></i> ফেরত নিন
                        </button>
                    </div>`;
                }).join('')}
            </div>`;
        }
    } else if (readerTab === 'history') {
        const sorted = [...allTx].sort((a, b) => b.id - a.id);
        if (sorted.length === 0) {
            tabContent = `<div class="card" style="text-align:center;padding:50px;color:var(--muted);"><i class="fas fa-clock-rotate-left" style="font-size:36px;margin-bottom:12px;opacity:0.3;display:block;"></i>কোনো ইতিহাস নেই</div>`;
        } else {
            tabContent = `
            <div class="card table-wrap" style="padding:0;overflow:hidden;">
                <table class="data-table">

                    <tbody>
                        ${sorted.map(t => {
                            const book = books.find(b => b.id === t.bookId);
                            return `<tr>
                                <td style="font-weight:600;">${book ? book.title : 'অজানা'}</td>
                                <td>${t.issueDate}</td>
                                <td>${t.dueDate}</td>
                                <td>${t.returnDate || '—'}</td>
                                <td><span class="badge ${t.status === 'returned' ? 'badge-green' : 'badge-orange'}">${t.status === 'returned' ? 'ফেরত দেওয়া হয়েছে' : 'ইস্যু আছে'}</span></td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>`;
        }
    }

    return `
    <div class="animate-in">
        <button class="btn-outline no-print" onclick="navigateTo('readers')" style="margin-bottom:16px;">
            <i class="fas fa-arrow-left"></i> রিডার তালিকায় ফিরুন
        </button>

        <div class="profile-header" style="margin-bottom:20px;">
            <div style="display:flex;align-items:center;gap:18px;position:relative;z-index:2;flex-wrap:wrap;">
                <div style="width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;border:3px solid rgba(255,255,255,0.3);">

                </div>

                    <div style="font-size:13px;opacity:0.85;">${reader.className} — রোল: ${reader.roll}</div>

                <div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn-outline" style="border-color:rgba(255,255,255,0.3);color:#fff;background:rgba(255,255,255,0.1);" onclick="openReaderModal(${reader.id})">
                        <i class="fas fa-pen"></i> সম্পাদনা
                    </button>
                    <button class="btn-outline" style="border-color:rgba(255,255,255,0.3);color:#fff;background:rgba(255,255,255,0.1);" onclick="deleteReader(${reader.id})">
                        <i class="fas fa-trash"></i> মুছুন
                    </button>
                </div>
            </div>
        </div>

        <div class="no-print" style="display:flex;gap:6px;margin-bottom:20px;background:var(--card);padding:6px;border-radius:12px;border:1px solid var(--border);width:fit-content;flex-wrap:wrap;">
            <button class="tab-btn ${readerTab === 'profile' ? 'active' : ''}" onclick="readerTab='profile';renderPage();">প্রোফাইল</button>
            <button class="tab-btn ${readerTab === 'issued' ? 'active' : ''}" onclick="readerTab='issued';renderPage();">
                বর্তমান বই ${issuedTx.length > 0 ? `<span style="background:var(--danger);color:#fff;padding:1px 7px;border-radius:10px;font-size:10px;margin-left:4px;">${issuedTx.length}</span>` : ''}
            </button>
            <button class="tab-btn ${readerTab === 'history' ? 'active' : ''}" onclick="readerTab='history';renderPage();">ইতিহাস</button>
        </div>

        ${tabContent}
    </div>`;
}

            <div class="table-wrap">
                <table class="data-table">
                    <thead><tr><th>রিডার</th><th>বই</th><th>ইস্যু তারিখ</th><th>ডিউ তারিখ</th><th>অ্যাকশন</th></tr></thead>
                    <tbody>
                        ${issuedList.length === 0 ? `<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--muted);">কোনো ইস্যুকৃত বই নেই</td></tr>` :
                        issuedList.map(t => {
                            const reader = readers.find(r => r.id === t.readerId);
                            const book = books.find(b => b.id === t.bookId);
                            return `<tr>
                                <td>
                                    <div style="font-weight:600;">${reader ? reader.name : 'অজানা'}</div>
                                    <div style="font-size:11px;color:var(--muted);">${reader ? reader.className : ''}</div>
                                </td>
                                <td>
                                    <div style="font-weight:600;">${book ? book.title : 'অজানা'}</div>
                                    <div style="font-size:11px;color:var(--muted);">${book ? book.bookNumber : ''}</div>
                                </td>
                                <td>${t.issueDate}</td>
                                <td style="font-weight:600;color:var(--danger);">${t.dueDate}</td>
                                <td>
                                    <button class="btn-sm" style="background:rgba(64,145,108,0.12);color:var(--success);font-weight:600;" onclick="returnBook(${t.id})">
                                        <i class="fas fa-rotate-left" style="margin-right:4px;"></i> ফেরত নিন
                                    </button>
                                </td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <style>
        @media (max-width: 768px) {
            .ir-grid { grid-template-columns: 1fr !important; }
        }
    </style>`;
}

function updateReturnBookList() {
    const readerId = parseInt(document.getElementById('returnReader').value);
    const sel = document.getElementById('returnBook');
    const issued = transactions.filter(t => t.readerId === readerId && t.status === 'issued');
    if (issued.length === 0) {
        sel.innerHTML = '<option value="">-- এই রিডারের কোনো ইস্যুকৃত বই নেই --</option>';
        return;
    }
    sel.innerHTML = '<option value="">-- বই নির্বাচন করুন --</option>' +
        issued.map(t => {
            const book = books.find(b => b.id === t.bookId);
            return `<option value="${t.id}">${book ? book.title + ' (' + book.bookNumber + ')' : 'অজানা'} — ইস্যু: ${t.issueDate}</option>`;
        }).join('');
}

function issueBook(e) {
    e.preventDefault();
    const readerId = parseInt(document.getElementById('issueReader').value);
    const bookId = parseInt(document.getElementById('issueBook').value);
    const issueDate = document.getElementById('issueDate').value;
    const dueDate = document.getElementById('dueDate').value;

    if (!issueDate || !dueDate) { showToast('তারিখ নির্বাচন করুন', 'error'); return; }

    const book = books.find(b => b.id === bookId);
    if (!book || book.available <= 0) { showToast('এই বইটি এখন পাওয়া যাচ্ছে না', 'error'); return; }

    const bnIssueDate = toBanglaDate(new Date(issueDate));
    const bnDueDate = toBanglaDate(new Date(dueDate));

    transactions.push({
        id: nextId(transactions), readerId, bookId,
        issueDate: bnIssueDate, dueDate: bnDueDate, returnDate: null, status: 'issued'
    });
    book.available--;
    saveData('lib_transactions', transactions);
    saveData('lib_books', books);
    showToast('বই ইস্যু করা হয়েছে');
    renderPage();
}

function quickReturn(e) {
    e.preventDefault();
    const txId = parseInt(document.getElementById('returnBook').value);
    const returnDate = document.getElementById('returnDate').value;
    if (!txId) { showToast('বই নির্বাচন করুন', 'error'); return; }
    if (!returnDate) { showToast('রিটার্ন তারিখ দিন', 'error'); return; }

    returnBook(txId, returnDate);
}

function returnBook(txId, specificDate) {
    const tx = transactions.find(t => t.id === txId);
    if (!tx || tx.status !== 'issued') return;

    const returnDate = specificDate ? toBanglaDate(new Date(specificDate)) : toBanglaDate(new Date());
    tx.returnDate = returnDate;
    tx.status = 'returned';

    const book = books.find(b => b.id === tx.bookId);
    if (book) book.available++;

    saveData('lib_transactions', transactions);
    saveData('lib_books', books);
    showToast('বই সফলভাবে ফেরত নেওয়া হয়েছে');
    renderPage();
}

// ==================== ইতিহাস পেজ ====================
function renderHistory() {
    const sorted = [...transactions].sort((a, b) => b.id - a.id);
    return `
    <div class="animate-in">
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:20px;">
            <div class="search-bar" style="flex:1;min-width:200px;max-width:360px;">
                <i class="fas fa-search"></i>
                <input class="form-input" id="historySearch" placeholder="নাম বা বই দিয়ে খুঁজুন..." oninput="filterHistory()" style="padding-left:40px;">
            </div>
            <select class="form-input" id="historyFilter" onchange="filterHistory()" style="width:auto;min-width:140px;">
                <option value="all">সব দেখুন</option>
                <option value="issued">ইস্যু আছে</option>
                <option value="returned">ফেরত দেওয়া হয়েছে</option>
            </select>
        </div>
        <div class="card table-wrap" style="padding:0;overflow:hidden;">
            <table class="data-table" id="historyTable">
                <thead>
                    <tr>
                        <th>নং</th>
                        <th>রিডার</th>
                        <th>ক্লাস</th>
                        <th>বই</th>
                        <th>ইস্যু তারিখ</th>
                        <th>ডিউ তারিখ</th>
                        <th>ফেরত তারিখ</th>
                        <th>স্ট্যাটাস</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>`;
}

function filterHistory() {
    const q = (document.getElementById('historySearch')?.value || '').toLowerCase();
    const f = document.getElementById('historyFilter')?.value || 'all';
    const sorted = [...transactions].sort((a, b) => b.id - a.id);
    const filtered = sorted.filter(t => {
        const reader = readers.find(r => r.id === t.readerId);
        const book = books.find(b => b.id === t.bookId);
        const matchSearch = !q || (reader && reader.name.toLowerCase().includes(q)) || (book && book.title.toLowerCase().includes(q));
        const matchFilter = f === 'all' || t.status === f;
        return matchSearch && matchFilter;
    });
    renderHistoryTable(filtered);
}

function renderHistoryTable(list) {
    const tbody = document.getElementById('historyBody');
    if (!tbody) return;
    if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--muted);">কোনো তথ্য পাওয়া যায়নি</td></tr>`;
        return;
    }
    tbody.innerHTML = list.map((t, i) => {
        const reader = readers.find(r => r.id === t.readerId);
        const book = books.find(b => b.id === t.bookId);
        return `<tr>
            <td style="font-weight:600;color:var(--muted);">${i + 1}</td>
            <td style="font-weight:600;">${reader ? reader.name : 'অজানা'}</td>
            <td style="font-size:12px;color:var(--muted);">${reader ? reader.className : ''}</td>
            <td>${book ? book.title : 'অজানা'}</td>
            <td>${t.issueDate}</td>
            <td style="color:var(--danger);font-weight:600;">${t.dueDate}</td>
            <td>${t.returnDate || '<span style="color:var(--muted);">—</span>'}</td>
            <td><span class="badge ${t.status === 'returned' ? 'badge-green' : 'badge-orange'}">${t.status === 'returned' ? 'ফেরত' : 'ইস্যু'}</span></td>
        </tr>`;
    }).join('');
}

// ==================== হেল্পার ফাংশন ====================
function toBanglaDate(date) {
    const digits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    const y = String(date.getFullYear()).split('').map(d => digits[parseInt(d)]).join('');
    const m = String(date.getMonth() + 1).padStart(2, '0').split('').map(d => digits[parseInt(d)]).join('');
    const d = String(date.getDate()).padStart(2, '0').split('').map(d => digits[parseInt(d)]).join('');
    return `${y}-${m}-${d}`;
}

function setDefaultDates() {
    const today = new Date().toISOString().split('T')[0];
    const due = new Date(Date.now() + 15 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
    const issueDateEl = document.getElementById('issueDate');
    const dueDateEl = document.getElementById('dueDate');
    const returnDateEl = document.getElementById('returnDate');
    if (issueDateEl) issueDateEl.value = today;
    if (dueDateEl) dueDateEl.value = due;
    if (returnDateEl) returnDateEl.value = today;
}

// ==================== পেজ রেন্ডারের পর কলব্যাক ====================
const observer = new MutationObserver(() => {
    if (currentPage === 'books') { filterBooks(); }
    if (currentPage === 'readers') { filterReaders(); }
    if (currentPage === 'issueReturn') { setDefaultDates(); }
    if (currentPage === 'history') { filterHistory(); }
});
observer.observe(document.getElementById('pageContent'), { childList: true });

// ==================== রিয়েলটাইম লোড ও লিসেনার (Firebase থেকে) ====================
let _initialLoadDone = false;
let _firstSnapCount = 0;

function _afterFirstLoad() {
    _firstSnapCount++;
    if (_firstSnapCount >= 3 && !_initialLoadDone) {
        _initialLoadDone = true;
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) overlay.remove();
        navigateTo('dashboard');
    }
}

// FIX: Firebase Realtime Database মাঝে মাঝে array-কে object আকারে ফেরত দেয়
// (বিশেষত array-র মাঝ থেকে কোনো item delete হলে)। এই ফাংশনটা নিশ্চিত করে
// books/readers/transactions সবসময় প্রকৃত array হিসেবেই থাকে, যাতে
// .push()/.find()/.filter() ইত্যাদি কখনো ভেঙে না পড়ে (যেটার কারণেই
// "বই ইস্যু করুন" সাবমিট করলে পেজ সাদা হয়ে যাচ্ছিল)।
function _toArray(v) {
    if (Array.isArray(v)) return v.filter(x => x != null);
    if (v && typeof v === 'object') return Object.values(v).filter(x => x != null);
    return [];
}

function initApp() {
    try {
        db.ref('lib_books').on('value', (snap) => {
            if (snap.exists()) {
                books = _toArray(snap.val());
            } else if (!_initialLoadDone) {
                books = JSON.parse(JSON.stringify(defaultBooks));
                saveData('lib_books', books);
            }
            if (_initialLoadDone) renderPage();
            else _afterFirstLoad();
        }, (err) => {
            console.error(err);
            showToast('বই ডেটা সিঙ্ক ব্যর্থ হয়েছে', 'error');
        });

        db.ref('lib_readers').on('value', (snap) => {
            if (snap.exists()) {
                readers = _toArray(snap.val());
            } else if (!_initialLoadDone) {
                readers = JSON.parse(JSON.stringify(defaultReaders));
                saveData('lib_readers', readers);
            }
            if (_initialLoadDone) renderPage();
            else _afterFirstLoad();
        }, (err) => {
            console.error(err);
            showToast('রিডার ডেটা সিঙ্ক ব্যর্থ হয়েছে', 'error');
        });

        db.ref('lib_transactions').on('value', (snap) => {
            if (snap.exists()) {
                transactions = _toArray(snap.val());
            } else if (!_initialLoadDone) {
                transactions = JSON.parse(JSON.stringify(defaultTransactions));
                saveData('lib_transactions', transactions);
            }
            if (_initialLoadDone) renderPage();
            else _afterFirstLoad();
        }, (err) => {
            console.error(err);
            showToast('লেনদেন ডেটা সিঙ্ক ব্যর্থ হয়েছে', 'error');
        });
    } catch (err) {
        console.error(err);
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) {
            overlay.innerHTML = `<div style="color:var(--danger);font-weight:700;text-align:center;padding:0 20px;">
                <i class="fas fa-triangle-exclamation" style="font-size:28px;display:block;margin-bottom:10px;"></i>
                ডেটাবেজ সংযোগ ব্যর্থ হয়েছে।<br>
                <span style="font-size:12px;font-weight:500;color:var(--muted);">firebaseConfig ঠিক আছে কিনা, ইন্টারনেট কানেকশন এবং ডেটাবেজ রুলস চেক করো।</span>
            </div>`;
        }
    }
}
initApp();
</script>
